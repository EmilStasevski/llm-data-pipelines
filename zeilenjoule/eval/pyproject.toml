[project]
name = "zj-eval"
version = "0.1.0"
description = "Quality metrics: verify, recall, nDCG, F1, QA scoring"
requires-python = ">=3.12"
dependencies = ["duckdb==2.0.0", "numpy==2.5.4", "pyyaml==6.0.3", "zj-reference"]

[dependency-groups]
dev = ["pyarrow==26.0.1"]

[tool.uv.sources]
zj-reference = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
