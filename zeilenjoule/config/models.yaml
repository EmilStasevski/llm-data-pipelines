# Model registry. Rule 8: only models whose licence allows this use.
# licence_verified: true only after reading the model card ourselves (date + note).
# status: probe = downloaded in Phase 0 for compatibility tests only; planned = from PLAN, not downloaded yet.
models:
  - id: multilingual-e5-small
    repo: intfloat/multilingual-e5-small
    kind: embedding
    licence: MIT
    licence_verified: false   # PLAN-independent probe model; verify card before any benchmark use
