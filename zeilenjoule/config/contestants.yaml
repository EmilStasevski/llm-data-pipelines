# Contestant registry (PLAN §5.3). Validated by harness/internal/config (`zj doctor`, `go test`).
# id:     <track letter><2 digits>_<tool>_<variant>; track letter == lower(track)
# track:  A–E = benchmark tracks; X = harness self-tests/calibration (never part of the report ranking)
# build:  optional command run by the harness BEFORE any measured window (compile, image pull …)
# versions_cmd: optional command printing a JSON version fingerprint (stored in env.versions; rule 9)
# cmd/args placeholders: {input} {output} {threads} {rows} {scale}
contestants:
  - id: x00_smoke_py
    track: X
    task: x.smoke
    versions_cmd: ["uv", "run", "--frozen", "--project", ".", "python", "-m", "zjmark.envinfo", "zjmark"]
    cmd: ["uv", "run", "--frozen", "--project", ".", "python", "-m", "zjmark.smoke"]
    args: ["--output", "{output}", "--rows", "{rows}", "--sleep", "1", "--threads", "{threads}"]
    needs_gpu: false
    servers: []
    scales: [S]
    anti_pattern: false

  - id: x01_smoke_rs
    track: X
    task: x.smoke
    build: ["cargo", "build", "--release", "--locked", "--manifest-path", "contestants/rust/Cargo.toml", "-p", "zj-smoke"]
    versions_cmd: ["rustc", "--version"]
    cmd: ["contestants/rust/target/release/zj-smoke"]
    args: ["--output", "{output}", "--rows", "{rows}", "--sleep", "1", "--threads", "{threads}"]
    needs_gpu: false
    servers: []
    scales: [S]
    anti_pattern: false

  # ---- calibration (PLAN §5.7), run by `zj calibrate`; track X, never ranked ----
  - id: x02_stressng_cpu
    track: X
    task: x.calib
    versions_cmd: ["stress-ng", "--version"]
    cmd: ["uv", "run", "--frozen", "--project", ".", "python", "-m", "zjmark.wrap"]
    args: ["--output", "{output}", "--", "stress-ng", "--cpu", "{threads}", "--timeout", "60s", "--quiet"]
    needs_gpu: false
    servers: []
    scales: [S]
    anti_pattern: false

  - id: x03_gpuburn_torch
    track: X
    task: x.calib
    versions_cmd: ["uv", "run", "--frozen", "--project", "contestants/python/embed", "python", "-m", "zj_embed.envcheck"]
    cmd: ["uv", "run", "--frozen", "--project", "contestants/python/embed", "python", "-m", "zj_embed.gpuburn"]
    args: ["--output", "{output}", "--seconds", "60"]
    needs_gpu: true
    servers: []
    scales: [S]
    anti_pattern: false

  - id: x04_sleep30_rs
    track: X
    task: x.smoke
    build: ["cargo", "build", "--release", "--locked", "--manifest-path", "contestants/rust/Cargo.toml", "-p", "zj-smoke"]
    versions_cmd: ["rustc", "--version"]
    cmd: ["contestants/rust/target/release/zj-smoke"]
    args: ["--output", "{output}", "--rows", "{rows}", "--sleep", "30", "--threads", "{threads}"]
    needs_gpu: false
    servers: []
    scales: [S]
    anti_pattern: false

