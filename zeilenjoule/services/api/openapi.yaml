openapi: 3.0.3
info:
  title: ZeilenJoule API
  version: 0.1.0
  description: |
    Row-wise RAG over German industrial fault notifications (Störmeldungen). Production stack of
    `e03_postgres_only` (ADR 0021): PostgreSQL + pgvector, TEI (bge-m3), vLLM (Qwen3.5-9B AWQ).
    All endpoints except the health checks need the header `X-API-Key`.
servers:
  - url: http://127.0.0.1:8080
security:
  - apiKey: []
paths:
  /v1/ingest:
    post:
      operationId: ingest
      summary: Upload a raw SAP-PM-like CSV (cp1252 or UTF-8, `;`) and start an ingest job
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string, format: binary}
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "400": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
  /v1/jobs/{id}:
    get:
      operationId: getJob
      summary: State of an ingest job
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "404": {$ref: "#/components/responses/Problem"}
  /v1/extract:
    post:
      operationId: extract
      summary: Extract the structured fields of fault notifications (Track D schema)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExtractRequest"}
      responses:
        "200":
          description: One result per input row, same order
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExtractResponse"}
        "400": {$ref: "#/components/responses/Problem"}
  /v1/search:
    post:
      operationId: search
      summary: Filtered hybrid search (dense + full text, RRF k = 60)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SearchRequest"}
      responses:
        "200":
          description: Hits, best first
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SearchResponse"}
        "400": {$ref: "#/components/responses/Problem"}
  /v1/ask:
    post:
      operationId: ask
      summary: "Answer a question (router SQL ↔ search); Server-Sent Events when `Accept: text/event-stream`"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AskRequest"}
      responses:
        "200":
          description: Answer with cited row ids (JSON) or an SSE stream of `route`, `answer`, `done` events
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AskResponse"}
            text/event-stream:
              schema: {type: string}
        "400": {$ref: "#/components/responses/Problem"}
  /healthz:
    get:
      operationId: healthz
      security: []
      summary: Liveness
      responses:
        "200": {description: alive}
  /readyz:
    get:
      operationId: readyz
      security: []
      summary: Readiness (database, embedding and LLM servers reachable)
      responses:
        "200": {description: ready}
        "503": {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    apiKey: {type: apiKey, in: header, name: X-API-Key}
  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
    Job:
      type: object
      required: [id, state, created_at]
      properties:
        id: {type: integer, format: int64}
        state: {type: string, enum: [queued, running, done, failed]}
        rows: {type: integer, format: int64, description: rows ingested so far}
        error: {type: string}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    Filters:
      type: object
      properties:
        werk: {type: string}
        regierungsbezirk: {type: string, enum: [Düsseldorf, Köln, Münster, Detmold, Arnsberg]}
        komponente: {type: string}
        schadensart: {type: string}
        datum_von: {type: string, format: date}
        datum_bis: {type: string, format: date}
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 2000}
        filters: {$ref: "#/components/schemas/Filters"}
        k: {type: integer, minimum: 1, maximum: 200, default: 20}
    Hit:
      type: object
      required: [meldung_id, score]
      properties:
        meldung_id: {type: string}
        score: {type: number, description: RRF score}
        werk: {type: string}
        datum: {type: string, format: date}
        meldungstext: {type: string}
    SearchResponse:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items: {$ref: "#/components/schemas/Hit"}
    AskRequest:
      type: object
      required: [question]
      properties:
        question: {type: string, minLength: 1, maxLength: 2000}
    AskResponse:
      type: object
      required: [route, cited_ids, estimated]
      properties:
        route:
          type: string
          enum: [sql, search, none]
          description: none = the router's answer was unusable (no valid JSON/route); answer is null, nothing cited
        sql: {type: string, description: the executed (checked) SQL, when route = sql}
        sql_status:
          type: string
          enum: [executed, rejected, failed]
          description: >-
            route = sql only. rejected = the SQL check refused the statement (layer 1), failed = the database refused
            or timed out (layer 2, read-only role); the reason is in the gateway log, not in the response.
        answer:
          description: >-
            text, a table (array of rows, each an array in `columns` order) or null (search – the answer is cited_ids)
          nullable: true
        columns:
          type: array
          items: {type: string}
          description: column names, when answer is a table
        cited_ids:
          type: array
          items: {type: string}
        estimated:
          type: boolean
          description: true when the answer depends on the estimated column `schadensart` (ADR 0020)
    ExtractRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: "#/components/schemas/ExtractRow"}
    ExtractRow:
      type: object
      required: [meldungstext]
      properties:
        anlage: {type: string}
        equipment_nr: {type: string}
        meldungstext: {type: string, maxLength: 4000}
        stillstand: {type: string}
    ExtractResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: {$ref: "#/components/schemas/ExtractResult"}
    ExtractResult:
      type: object
      required: [valid]
      properties:
        valid: {type: boolean, description: the model output satisfied spec/schema_stoermeldung.json}
        fields:
          type: object
          additionalProperties: true
          description: komponente, schadensart, ursache, massnahme, sicherheitsrelevant, stillstand_minuten, ersatzteil_materialnr
