version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      # CLI output to stdout/stderr: a failed terminal write is not actionable
      exclude-functions: [fmt.Fprint, fmt.Fprintf, fmt.Fprintln]
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: true   # internal tool; package docs required, per-symbol docs optional
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
formatters:
  enable:
    - gofmt
    - goimports
run:
  build-tags: [integration] # lint the integration tests too
