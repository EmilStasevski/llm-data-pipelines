[project]
name = "zj-embed"
version = "0.1.0"
description = "Track B embedding contestants (sentence-transformers, ONNX Runtime GPU) + exact GPU search"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "sentence-transformers==6.2.0",
    "onnxruntime-gpu==1.31.1",
    "onnx==1.23.2",
    "nvidia-ml-py==13.615.71",
    "numpy==2.5.4",
    "zjmark",
    "pyarrow==26.0.1",
]

[dependency-groups]
dev = ["pytest==9.*"]

[tool.uv.sources]
zjmark = { path = "../../../libs/python/zjmark", editable = true }
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
