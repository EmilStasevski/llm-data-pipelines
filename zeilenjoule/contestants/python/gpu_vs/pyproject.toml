[project]
name = "zj-gpu-vs"
version = "0.1.0"
description = "Track C GPU vector-search contestant (RAPIDS cuVS CAGRA); separate env so Track A's gpu_df lock stays untouched"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cuvs-cu13==26.10.0",
    "cupy-cuda13x==14.2.0",
    "cuda-toolkit[cudart]==13.5.0",  # cuvs-cu13 does not declare libcudart (cudf does, via its extras)
    "pyarrow==26.0.1",
    "numpy==2.5.4",
    "nvidia-ml-py==13.615.71",
    "zjmark",
]

[dependency-groups]
dev = ["pytest==9.*"]

[tool.uv.sources]
zjmark = { path = "../../../libs/python/zjmark", editable = true }

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
