    { name = "gliner" },
    { name = "nvidia-ml-py" },
    { name = "pyarrow" },
    { name = "pyyaml" },
    { name = "torch" },
    { name = "transformers" },
    { name = "zj-llm-clients" },
    { name = "zj-reference" },
    { name = "zjmark" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "gliner", specifier = "==0.2.30" },
    { name = "nvidia-ml-py", specifier = "==13.615.71" },
    { name = "pyarrow", specifier = "==26.0.1" },
    { name = "pyyaml", specifier = "==6.0.3" },
    { name = "torch", specifier = "==2.14.1", index = "https://download.pytorch.org/whl/cu130" },
    { name = "transformers", specifier = "==5.22.2" },
    { name = "zj-llm-clients", editable = "../llm-clients" },
    { name = "zj-reference", editable = "../../../reference" },
    { name = "zjmark", editable = "../../../libs/python/zjmark" },
]

[package.metadata.requires-dev]
dev = [{ name = "pytest", specifier = "==9.*" }]

[[package]]
name = "zj-reference"
version = "0.1.0"
source = { editable = "../../../reference" }
dependencies = [
    { name = "duckdb" },
    { name = "numpy" },
    { name = "pyarrow" },
    { name = "pyyaml" },
    { name = "snowballstemmer" },
]

[package.metadata]
requires-dist = [
    { name = "duckdb", specifier = "==2.0.0" },
    { name = "numpy", specifier = "==2.5.4" },
    { name = "pyarrow", specifier = "==26.0.1" },
    { name = "pyyaml", specifier = "==6.0.3" },
    { name = "snowballstemmer", specifier = "==3.1.1" },
]

[[package]]
name = "zjmark"
version = "0.1.0"
source = { editable = "../../../libs/python/zjmark" }
