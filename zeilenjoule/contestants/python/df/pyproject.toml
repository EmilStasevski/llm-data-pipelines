[project]
name = "zj-df"
version = "0.1.0"
description = "Track A CPU dataframe contestants (pandas, Polars 2.x, DuckDB, PyArrow)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars==2.1.0",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "duckdb==2.0.0",
    "numpy==2.5.4",
    "zjmark",
]

[dependency-groups]
dev = ["pytest==9.*", "pandas-stubs==3.1.0.261029", "pyarrow-stubs==20.0.0.20260819"]

[tool.uv.sources]
zjmark = { path = "../../../libs/python/zjmark", editable = true }

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
