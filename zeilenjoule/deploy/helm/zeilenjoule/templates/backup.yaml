{{- if and .Values.backup.enabled .Values.postgres.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
  labels: {{- include "zj.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # backups survive `helm uninstall`
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.backup.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.backup.storage }}}}
---
# pg_dump -Fc nightly, keeps the newest backup.keep files. Restore: docs/RUNBOOK.md §6.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels: {{- include "zj.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: zeilenjoule
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: backup
            zeilenjoule.io/backup: "true"
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            {{- include "zj.podSecurity" . | nindent 12 }}
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          containers:
            - name: pg-dump
              image: {{ .Values.postgres.image }}
              env:
                - {name: PGHOST, value: postgres}
                - {name: PGUSER, value: {{ .Values.externalDatabase.user }}}
                - {name: PGDATABASE, value: {{ .Values.externalDatabase.database }}}
                - {name: KEEP, value: {{ .Values.backup.keep | quote }}}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD}}
              command:
                - bash
                - -euo
                - pipefail
                - -c
                - |
                  f=/backups/zeilenjoule-$(date -u +%Y%m%dT%H%M%SZ).dump
                  pg_dump -Fc -f "$f.part" && mv "$f.part" "$f"
                  ls -1t /backups/zeilenjoule-*.dump | tail -n +$((KEEP + 1)) | xargs -r rm --
                  ls -l /backups
              securityContext:
                {{- include "zj.containerSecurity" . | nindent 16 }}
              resources:
                requests: {cpu: 250m, memory: 256Mi}
                limits: {memory: 1Gi}
              volumeMounts:
                - {name: backups, mountPath: /backups}
          volumes:
            - name: backups
              persistentVolumeClaim: {claimName: backups}
{{- end }}
