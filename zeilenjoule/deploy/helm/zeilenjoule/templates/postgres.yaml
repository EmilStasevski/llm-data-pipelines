{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels: {{- include "zj.labels" . | nindent 4 }}
data:
  # same file as deploy/compose/postgres-init (files/postgres-init is a symlink)
  10-roles.sh: |-
{{ .Files.Get "files/postgres-init/10-roles.sh" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "zj.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "zj.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "zj.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {{- include "zj.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "zj.selector" (dict "root" . "component" "postgres") | nindent 8 }}
      annotations:
        checksum/init: {{ .Files.Get "files/postgres-init/10-roles.sh" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "zj.podSecurity" . | nindent 8 }}
        runAsUser: 999      # postgres in the official image
        runAsGroup: 999
        fsGroup: 999
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args: [postgres, {{- range .Values.postgres.args }} {{ . | quote }},{{- end }} -c, listen_addresses=*]
          env:
            - {name: POSTGRES_USER, value: {{ .Values.externalDatabase.user }}}
            - {name: POSTGRES_DB, value: {{ .Values.externalDatabase.database }}}
            - {name: PGDATA, value: /var/lib/postgresql/18/docker}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD}}
            - name: ZJ_READER_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: ZJ_READER_PASSWORD}}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -U, {{ .Values.externalDatabase.user }}, -d, {{ .Values.externalDatabase.database }}]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -U, {{ .Values.externalDatabase.user }}]}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            {{- include "zj.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: init
          configMap: {name: postgres-init, defaultMode: 0555}
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: {{ .Values.postgres.shm }}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.postgres.storage }}}}
{{- end }}
