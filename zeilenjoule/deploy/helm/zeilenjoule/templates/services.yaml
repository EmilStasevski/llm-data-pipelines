apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  labels: {{- include "zj.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.uploads.accessMode }}]
  {{- with .Values.uploads.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.uploads.size }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {{- include "zj.labels" . | nindent 4 }}
spec:
  selector: {{- include "zj.selector" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: metrics, port: 9090, targetPort: metrics}
{{- range list "gateway" "worker" }}
---
# headless: Prometheus finds every pod via DNS (dns_sd_configs), no Kubernetes API access needed
apiVersion: v1
kind: Service
metadata:
  name: {{ . }}-metrics
  labels: {{- include "zj.labels" $ | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "zj.selector" (dict "root" $ "component" .) | nindent 4 }}
  ports: [{name: metrics, port: 9090, targetPort: metrics}]
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {{- include "zj.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "zj.selector" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "zj.selector" (dict "root" . "component" "gateway") | nindent 8 }}
        zeilenjoule.io/db-client: "true"
        zeilenjoule.io/model-client: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "zj.podSecurity" . | nindent 8 }}
        runAsUser: 65532   # distroless nonroot
        runAsGroup: 65532
        fsGroup: 65532
      terminationGracePeriodSeconds: 30
      initContainers:
        {{- include "zj.migrateInit" . | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "zj.image" (dict "root" . "name" "gateway" "repo" "gateway") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "zj.serviceEnv" . | nindent 12 }}
            - name: ZJ_READER_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: ZJ_READER_PASSWORD}}
            - name: ZJ_READER_URL
              value: "postgres://zj_ask:$(ZJ_READER_PASSWORD)@{{ include "zj.dbHost" . }}:{{ .Values.externalDatabase.port }}/{{ .Values.externalDatabase.database }}?{{ include "zj.dbQuery" . }}"
            - name: ZJ_API_KEYS
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: ZJ_API_KEYS}}
            - {name: ZJ_RATE_LIMIT, value: {{ .Values.gateway.rateLimit | quote }}}
            - {name: ZJ_RATE_BURST, value: {{ .Values.gateway.rateBurst | quote }}}
            - {name: ZJ_REQUEST_TIMEOUT, value: {{ .Values.gateway.requestTimeout | quote }}}
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9090}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          # /readyz checks DB + TEI + vLLM: the gateway takes no traffic until the model servers answer
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            {{- include "zj.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - {name: uploads, mountPath: /var/lib/zj/uploads}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: uploads}
        - {name: tmp, emptyDir: {sizeLimit: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: {{- include "zj.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: 1   # River queue "ingest" runs MaxWorkers 1; a second pod would compete for the one GPU (ADR 0023)
  strategy: {type: Recreate}
  selector:
    matchLabels: {{- include "zj.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "zj.selector" (dict "root" . "component" "worker") | nindent 8 }}
        zeilenjoule.io/db-client: "true"
        zeilenjoule.io/model-client: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "zj.podSecurity" . | nindent 8 }}
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      # graceful River stop is 60 s, then running jobs are cancelled and retried (zj-worker main.go)
      terminationGracePeriodSeconds: 75
      initContainers:
        {{- include "zj.migrateInit" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "zj.image" (dict "root" . "name" "worker" "repo" "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "zj.serviceEnv" . | nindent 12 }}
            - {name: ZJ_PARSER_THREADS, value: {{ .Values.worker.parserThreads | quote }}}
          ports: [{name: metrics, containerPort: 9090}]
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            {{- include "zj.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - {name: uploads, mountPath: /var/lib/zj/uploads}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: uploads}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: {{ .Values.worker.tmpSize }}}
{{- if .Values.gateway.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  labels: {{- include "zj.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: {{ .Values.gateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.gateway.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.gateway.autoscaling.targetCPUUtilization }}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  labels: {{- include "zj.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "zj.selector" (dict "root" . "component" "gateway") | nindent 6 }}
{{- end }}
{{- if .Values.gateway.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  labels: {{- include "zj.labels" . | nindent 4 }}
  {{- with .Values.gateway.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.gateway.ingress.className }}
  {{- with .Values.gateway.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.gateway.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: gateway, port: {name: http}}}
{{- end }}
