# Scrape config for deploy/compose (service names resolve on the compose network). 5 s for the energy counters:
# joules per request = Δ energy / Δ requests needs short windows to separate bursts.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules/*.yml]
scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ["gateway:9090"]}]
  - job_name: worker
    static_configs: [{targets: ["worker:9090"]}]
  - job_name: energy
    scrape_interval: 5s
    static_configs: [{targets: ["energy-exporter:9877"]}]
  - job_name: vllm
    static_configs: [{targets: ["vllm:8000"]}]
  - job_name: tei
    static_configs: [{targets: ["tei:8081"]}]
