[project]
name = "zj-datagen"
version = "0.1.0"
description = "Synthetic NRW industrial data generator + real-data fetchers"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "pyarrow==26.0.1",
    "pyyaml==6.0.3",
    "faker==40.44.0",
    "openpyxl==3.1.5",
    "httpx==0.28.1",
    "duckdb==2.0.0",
    "zj-eval",
]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
zj-eval = { workspace = true }
