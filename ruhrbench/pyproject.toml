[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ruhrbench"
version = "0.1.0"
description = "Benchmarking RAG / extraction pipelines on German NRW industry data, from pandas to Rust"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow",
    "httpx",
    "pymupdf",
    "lxml",
    "typer",
    "rich",
]

[project.optional-dependencies]
hf = ["huggingface_hub"]

[project.scripts]
ruhrbench = "ruhrbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ruhrbench"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest",
    "pytest-benchmark",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
files = ["src"]

[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true
